name: FAQVec D04 - Real E5 and Model Race
on:
  push:
    paths:
      - ".github/workflows/faqvec-d04-real-models.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      WANDB_DISABLED: "true"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout self-authored synthetic corpus
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU torch without CUDA packages
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install SentenceTransformer research dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "sentence-transformers>=4.1,<5" "transformers>=4.48,<5" "huggingface-hub>=0.33,<1" "datasets>=3.2,<4" "accelerate>=1.3,<2" "psutil>=5.9,<8" "hf-xet>=1,<2"
      - name: Validate own corpus and measure real TF-IDF
        run: |
          python -m scripts.faqvec_d03_ai_review --check-only
          python -m scripts.faqvec_d04_real_benchmark --ai-owned-research --output /tmp/faqvec_d04_tfidf.json
      - name: Download E5-base MIT model weights only
        run: python -m scripts.download_faqvec_model_weights --model e5-base --confirm-download
      - name: Fine-tune real E5-base on 74 own training intents
        run: |
          python -m scripts.train_faqvec_v2 --ai-owned-research --backbone models/e5-base-original --epochs 1 --batch-size 2 --gradient-accumulation 1 --output /tmp/faqvec-tr-e5-research
      - name: Download Apache-2.0 MiniLM model weights only
        run: python -m scripts.download_faqvec_model_weights --model minilm --confirm-download
      - name: Download MIT BGE-M3 model weights only
        run: python -m scripts.download_faqvec_model_weights --model bge-m3 --confirm-download
      - name: Compare all measured models with same gallery and OOS threshold
        run: |
          python -m scripts.faqvec_d04_real_benchmark --ai-owned-research --model e5-base=models/e5-base-original --model faqvec-tr=/tmp/faqvec-tr-e5-research/model --model minilm=models/minilm-original --model bge-m3=models/bge-m3-original --latency-samples 6 --output /tmp/faqvec_d04_all_models.json
      - name: Publish measurement reports - NEVER model weights or raw corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faqvec-d04-research-metrics-only
          path: |
            /tmp/faqvec_d04_tfidf.json
            /tmp/faqvec_d04_all_models.json
            /tmp/faqvec-tr-e5-research/model/faqvec_v2_manifest.json
            models/e5-base-original/faqvec_backbone_origin.json
            models/minilm-original/faqvec_backbone_origin.json
            models/bge-m3-original/faqvec_backbone_origin.json
          if-no-files-found: warn
          retention-days: 30

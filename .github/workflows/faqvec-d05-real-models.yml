name: FAQVec D05 - Owned Data, Calibration and Real Model Race
on:
  push:
    paths:
      - ".github/workflows/faqvec-d05-real-models.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d05-real-research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      WANDB_DISABLED: "true"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout - only own Turkish question corpus
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: CPU PyTorch without CUDA package downloads
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Offline model runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "sentence-transformers>=4.1,<5" "transformers>=4.48,<5" "huggingface-hub>=0.33,<1" "datasets>=3.2,<4" "accelerate>=1.3,<2" "psutil>=5.9,<8" "hf-xet>=1,<2"
      - name: Validate fixed 96 gallery and OWNED-only 24 additional train intents
        run: |
          python -m scripts.faqvec_d03_ai_review --check-only
          python -m scripts.faqvec_d05_owned_data
          python -m pytest tests/test_faqvec_d05_research.py -q
      - name: D05 own-corpus TF-IDF reference
        run: |
          python -m scripts.faqvec_d05_real_benchmark --ai-owned-research --output /tmp/faqvec_d05_tfidf.json
      - name: Download MIT E5-base MODEL weights only
        run: python -m scripts.download_faqvec_model_weights --model e5-base --confirm-download
      - name: Train D04 CONTROL E5 74 pairs with real weights
        run: |
          python -m scripts.train_faqvec_v2 --ai-owned-research --backbone models/e5-base-original --epochs 1 --batch-size 2 --gradient-accumulation 1 --output /tmp/faqvec-d04-repro
      - name: Train D05 CANDIDATE 196 own pairs and AI train hard negatives
        run: |
          python -m scripts.train_faqvec_v2 --ai-owned-research --d05-owned-expansion --include-ai-negatives --backbone models/e5-base-original --epochs 1 --batch-size 2 --gradient-accumulation 1 --output /tmp/faqvec-d05-owned
      - name: Download Apache-2.0 MiniLM MODEL weights only
        run: python -m scripts.download_faqvec_model_weights --model minilm --confirm-download
      - name: Download MIT BGE-M3 pinned safetensors weights only
        run: python -m scripts.download_faqvec_model_weights --model bge-m3 --confirm-download
      - name: Score all six real models - old versus new validation-only thresholds
        run: |
          python -m scripts.faqvec_d05_real_benchmark --ai-owned-research --require-all --model e5-base=models/e5-base-original --model faqvec-d04=/tmp/faqvec-d04-repro/model --model faqvec-d05=/tmp/faqvec-d05-owned/model --model minilm=models/minilm-original --model bge-m3=models/bge-m3-original --latency-samples 8 --output /tmp/faqvec_d05_all_models.json
      - name: Publish evidence only, never model weights nor original text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faqvec-d05-metrics-and-rights-only
          path: |
            /tmp/faqvec_d05_tfidf.json
            /tmp/faqvec_d05_all_models.json
            /tmp/faqvec-d04-repro/model/faqvec_v2_manifest.json
            /tmp/faqvec-d05-owned/model/faqvec_v2_manifest.json
            models/e5-base-original/faqvec_backbone_origin.json
            models/minilm-original/faqvec_backbone_origin.json
            models/bge-m3-original/faqvec_backbone_origin.json
          if-no-files-found: warn
          retention-days: 30

name: P1 P2 Chromium Browser E2E
on:
  push:
    paths:
      - ".github/workflows/p1-p2-browser-e2e.yml"
      - "app/main.py"
      - "app/customer_flows.py"
      - "app/faq_suggestions.py"
      - "frontend/app.js"
      - "frontend/index.html"
      - "frontend/style.css"
      - "tests/browser_p1_p2_smoke.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p1-p2-local-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install API and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
      - name: Browser uses only localhost and temporary SQLite database
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python tests/browser_p1_p2_smoke.py

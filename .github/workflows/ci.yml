name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js
      - name: Özgün Türkçe veri denetimi (eğitim veya ağ çağrısı yok)
        run: python -m scripts.build_faqvec_original --check-only
      - name: D03-02 yapay zekâ inceleme kayıtlarının kaynak doğrulaması
        run: python -m scripts.faqvec_d03_ai_review --check-only
      - name: D05 Windows özgün eğitim ve güvenlik denetimi
        run: |
          python -m scripts.faqvec_d05_owned_data
          python -m scripts.faqvec_d05_safety_slices
      - name: D05 Windows PowerShell betiği sözdizimi
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'run_faqvec_d05_windows.ps1'),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: D04 gerçek TF-IDF araştırma ölçümü (sıfır model indirme)
        run: python -m scripts.faqvec_d04_real_benchmark --ai-owned-research --latency-samples 6 --output "${{ runner.temp }}/faqvec_d04_tfidf.json"
      - name: D04 ölçüm raporu - dış model ağırlıkları olmadan
        uses: actions/upload-artifact@v4
        with:
          name: faqvec-d04-tfidf-measured
          path: ${{ runner.temp }}/faqvec_d04_tfidf.json
          retention-days: 30
      - name: D05 özgün 24 eğitim niyeti ve 196 çift kontrolü
        run: python -m scripts.faqvec_d05_owned_data
      - name: D05 cevap-yok güvenlik dilimlerini doğrula
        run: python -m scripts.faqvec_d05_safety_slices
      - name: D05 güvenlik politikası TF-IDF canlı raporu (model indirme yok)
        run: python -m scripts.faqvec_d05_real_benchmark --ai-owned-research --latency-samples 4 --output "${{ runner.temp }}/faqvec_d05_tfidf.json"
      - name: Comparison demo
        run: python -m scripts.compare

  windows-setup-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test Windows BAT installer (no server or browser)
        shell: cmd
        run: call setup_windows.bat --check-only
      - name: FAQVec-TR v0.2 Windows script check (no download)
        shell: cmd
        run: call setup_faqvec_v2_windows.bat --check-only
      - name: D02 Windows reviewer preparation script check (no download)
        shell: cmd
        run: call setup_faqvec_d02_windows.bat --check-only
      - name: Bağımlılıkları Windows üzerinde kur
        run: python -m pip install -r requirements.txt
      - name: Özgün veri taslağının Windows kontrolleri
        run: python -m scripts.build_faqvec_original --check-only
      - name: D03-02 yapay zekâ inceleme kayıtlarının kaynak doğrulaması
        run: python -m scripts.faqvec_d03_ai_review --check-only

name: FAQVec D06 - Frozen Hard Questions, Real E5 and BGE
on:
  push:
    paths:
      - ".github/workflows/faqvec-d06-frozen-hard.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d06-locked-research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      WANDB_DISABLED: "true"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout frozen D03, D05 and D06 sources
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install model runtime without third-party dataset download
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "sentence-transformers>=4.1,<5" "transformers>=4.48,<5" "huggingface-hub>=0.33,<1" "datasets>=3.2,<4" "accelerate>=1.3,<2" "psutil>=5.9,<8" "hf-xet>=1,<2"
      - name: Freeze-check new 72 D06 questions (never for model selection)
        run: |
          python -m scripts.faqvec_d06_frozen_challenge
          python -m pytest tests/test_faqvec_d06_frozen_hard.py -q
      - name: TF-IDF real D06 hard test (old validation threshold only)
        run: |
          python -m scripts.faqvec_d06_hard_benchmark --ai-owned-research --latency-samples 4 --output /tmp/faqvec_d06_tfidf_hard.json
      - name: Download original MIT E5-base model weights (NO sentence corpus)
        run: python -m scripts.download_faqvec_model_weights --model e5-base --confirm-download
      - name: Reproduce old D04 control from untouched training sources
        run: |
          python -m scripts.train_faqvec_v2 --ai-owned-research --backbone models/e5-base-original --epochs 1 --batch-size 2 --gradient-accumulation 1 --output /tmp/faqvec-d06-d04-control
      - name: Reproduce D05 196 train pairs and 23 train-only negatives
        run: |
          python -m scripts.train_faqvec_v2 --ai-owned-research --d05-owned-expansion --include-ai-negatives --backbone models/e5-base-original --epochs 1 --batch-size 2 --gradient-accumulation 1 --output /tmp/faqvec-d06-d05-candidate
      - name: Download Apache MiniLM weights only
        run: python -m scripts.download_faqvec_model_weights --model minilm --confirm-download
      - name: Download MIT BGE-M3 safetensors pinned weights only
        run: python -m scripts.download_faqvec_model_weights --model bge-m3 --confirm-download
      - name: Score six models against untouched NEW D06 test (locked calibration)
        run: |
          python -m scripts.faqvec_d06_hard_benchmark --ai-owned-research --require-all --model e5-base=models/e5-base-original --model faqvec-d04=/tmp/faqvec-d06-d04-control/model --model faqvec-d05=/tmp/faqvec-d06-d05-candidate/model --model minilm=models/minilm-original --model bge-m3=models/bge-m3-original --latency-samples 8 --output /tmp/faqvec_d06_six_models_hard.json
      - name: Publish metrics and training provenance ONLY, never model weights/test questions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faqvec-d06-frozen-hard-metrics-only
          path: |
            /tmp/faqvec_d06_tfidf_hard.json
            /tmp/faqvec_d06_six_models_hard.json
            /tmp/faqvec-d06-d04-control/model/faqvec_v2_manifest.json
            /tmp/faqvec-d06-d05-candidate/model/faqvec_v2_manifest.json
            models/e5-base-original/faqvec_backbone_origin.json
            models/minilm-original/faqvec_backbone_origin.json
            models/bge-m3-original/faqvec_backbone_origin.json
          if-no-files-found: warn
          retention-days: 30
